name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flo
          POSTGRES_PASSWORD: flo
          POSTGRES_DB: flo_execution_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # When set, the vitest global setup reuses this Postgres instead of booting
      # an embedded cluster.
      TEST_DATABASE_URL: postgres://flo:flo@localhost:5432/flo_execution_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test