# Build only: runtime secrets are bound by scripts/deploy-api.py.
# Supply _IMG as an Artifact Registry image tagged with the Git commit.
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'Dockerfile.api', '-t', '${_IMG}', '.']
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
images:
  - '${_IMG}'
